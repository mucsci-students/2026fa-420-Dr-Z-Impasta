[project]
name = "2026fa-420-dr-z-impasta"
version = "0.1.0"
description = "Dr. ZImpasta: an interactive shell around the course-constraint-scheduler library"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "course-constraint-scheduler>=3.0.0",
    "fastapi>=0.116",
    "openai>=3.37",
    "rich>=15.0.0",
    "uvicorn[standard]>=0.35",
]

[project.scripts]
zimpasta = "zimpasta.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.13",
    "pytest>=8.0",
    "pytest-playwright>=0.10.0",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "zimpasta"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live tests call the real OpenAI API. They run only when asked for: uv run pytest -m live
addopts = ["-m", "not live"]
markers = ["live: calls the real OpenAI API (needs OPENAI_API_KEY); run with -m live"]
filterwarnings = [
    # Raised inside starlette.testclient (a dependency), not in this project's code.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
