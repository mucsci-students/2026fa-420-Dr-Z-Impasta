name: Cloudflare Pages

# Publishes the browser version of the GUI (`npm run build:browser`) to Cloudflare Pages:
# the whole app, with Python running in the visitor's browser. Setup and addresses are in
# docs/cloudflare-pages.md.
#
# - Each pull request into develop gets a preview at <branch>.dr-zimpasta.pages.dev,
#   updated on every push to it. GitHub shows its link on the pull request.
# - Each push to develop (a merged pull request) updates dr-zimpasta.pages.dev.

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  PROJECT: dr-zimpasta
  BRANCH: ${{ github.head_ref || github.ref_name }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check the Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::The CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets aren't available (they aren't set, or this pull request comes from a fork). See docs/cloudflare-pages.md."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build:browser
        working-directory: frontend
      - uses: cloudflare/wrangler-action@v4
        id: deploy
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --commit-dirty: installing wrangler leaves untracked files in the checkout.
          command: >-
            pages deploy frontend/dist-browser --project-name=${{ env.PROJECT }}
            --branch=${{ env.BRANCH }}
            --commit-hash=${{ github.event.pull_request.head.sha || github.sha }}
            --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Show the address
        env:
          ALIAS: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          DEPLOYMENT: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "### Deployed ${BRANCH}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch address: ${ALIAS:-none (production)}" >> "$GITHUB_STEP_SUMMARY"
          echo "- This deployment: ${DEPLOYMENT}" >> "$GITHUB_STEP_SUMMARY"
