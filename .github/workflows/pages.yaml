name: Cloudflare Pages

# Publishes the GUI's static build to Cloudflare Pages (setup: docs/cloudflare-pages.md).
# Only the React app is hosted. The Python API runs on each user's own computer, so the
# hosted page shows the interface with its "Can't reach the server" banner.
#
# A push runs this workflow only if the pushed commit contains this file. Until
# ci/cloudflare-pages is merged, only that branch deploys; once it is merged, develop does.
# Remove ci/cloudflare-pages from the list after the merge.

on:
  push:
    branches:
      - develop
      - ci/cloudflare-pages

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: dr-zimpasta

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check the Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::The CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets aren't set. See docs/cloudflare-pages.md."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --commit-dirty: installing wrangler leaves untracked files in the checkout.
          command: >-
            pages deploy src/zimpasta/web --project-name=${{ env.PROJECT }}
            --branch=${{ github.ref_name }} --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
